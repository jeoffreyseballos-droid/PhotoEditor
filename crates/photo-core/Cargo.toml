[package]
name = "photo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
photo-contracts = { path = "../photo-contracts" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
lcms2 = { version = "6.2", features = ["static"] }
roxmltree = "0.21"
tiff = "0.11"
same-file = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
base64 = "0.22"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.32"
