[workspace]
members = ["crates/photo-contracts", "crates/photo-core", "crates/photo-raw-helper", "crates/photo-mask-helper", "src-tauri"]
default-members = ["crates/photo-contracts", "crates/photo-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
